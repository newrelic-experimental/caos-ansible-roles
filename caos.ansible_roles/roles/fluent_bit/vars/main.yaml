---

# Fluent Bit image repo, no tag (bundles Fluent Bit + the New Relic out_newrelic.so plugin)
fluent_bit_image: "newrelic/newrelic-fluentbit-output"
# single image tag to run, passed at run time. Call the role once per version
# for a canary (e.g. once with "3.7.0", once with "3.6.0")
fluent_bit_version: ""
# Fluent Bit config template; override with a path to a custom template/file
fluent_bit_config: "fluent-bit.conf.j2"

# New Relic Logs ingest endpoint; empty derives from the `staging` flag
nr_logs_endpoint: ""
# New Relic license key used by the output plugin
nr_license_key: ""
# target staging vs production ingest
staging: true

...
