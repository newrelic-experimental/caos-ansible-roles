---

# flag to control if the Infra Agent is installed or uninstalled
uninstall: false
# flag to control environment: on-host | container
is_containerized: false
# flag to control if the Infra Agent is FIPS enabled
fips_enabled: false

# install specific version or empty for latest
target_version: ""

# package repository
repo_endpoint: "https://download.newrelic.com/infrastructure_agent"

# custom config template
custom_config_template: ""

# agent config:
nr_license_key: ""
display_name: "{{ inventory_hostname }}"
metrics_system_sample_rate: "{{ nria_metrics_system_sample_rate | default('5') }}"
metrics_storage_sample_rate: "{{ nria_metrics_storage_sample_rate | default('20') }}"
metrics_network_sample_rate: "{{ nria_metrics_network_sample_rate | default('10') }}"
dpkg_interval_sec: "{{ nria_dpkg_interval_sec | default('30') }}"
daemontools_interval_sec: "{{ nria_daemontools_interval_sec | default('15') }}"
facter_interval_sec: "{{ nria_facter_interval_sec | default('30') }}"
network_interface_interval_sec: "{{ nria_network_interface_interval_sec | default('60') }}"
cloud_security_group_refresh_sec: "{{ nria_cloud_security_group_refresh_sec }}"
kernel_modules_refresh_sec: "{{ nria_kernel_modules_refresh_sec }}"
event_queue_depth: "{{ nria_event_queue_depth }}"
log_level: "{{ nria_log_level | default('info') }}"
log_forward: "{{ nria_log_forward | default('false') }}"
log_rotation_mb: "{{ nria_log_rotation_mb | default('0') }}"
log_rotation_max_files: "{{ nria_log_rotation_max_files | default('0') }}"
log_rotation_compressed: "{{ nria_log_rotation_compressed | default('false') }}"
staging: true
custom_attributes: {}
enable_process_metrics: 'true'
self_instrumentation: false

# flag to forward docker logs to nr1
forward_docker_logs: false

# custom-path mode: relocates agent/plugin/logging directories and injects the
# NRIA_* env vars, instead of the agent's default-path layout. Off by
# default so existing callers are unaffected.
custom_paths_enabled: "{{ nria_custom_paths_enabled | default(false) }}"
agent_dir: "{{ nria_agent_dir | default('') }}"
agent_temp_dir: "{{ nria_agent_temp_dir | default('') }}"
plugin_dir: "{{ nria_plugin_dir | default('') }}"
custom_plugin_installation_dir: "{{ nria_custom_plugin_installation_dir | default('') }}"
safe_bin_dir: "{{ nria_safe_bin_dir | default('') }}"
logging_configs_dir: "{{ nria_logging_configs_dir | default('') }}"
logging_home_dir: "{{ nria_logging_home_dir | default('') }}"
# Windows only - where fluent-bit's exe lives; unused on Linux (installed via apt/yum/zypp).
logging_bin_dir: "{{ nria_logging_bin_dir | default('') }}"
status_server_enabled: "{{ nria_status_server_enabled | default(true) }}"
status_server_port: "{{ nria_status_server_port | default('18003') }}"
disable_plugin_default_dir_scan: "{{ nria_disable_plugin_default_dir_scan | default(true) }}"
nr_host_id: "{{ nria_nr_host_id | default(inventory_hostname) }}"
# Bundled OHI copied into custom_plugin_installation_dir and referenced by name (no exec:),
# to exercise binary-by-name lookup under disable_plugin_default_dir_scan.
custom_path_integration_name: "{{ nria_custom_path_integration_name | default('nri-flex') }}"
custom_path_integration_event_type: "{{ nria_custom_path_integration_event_type | default('customPathFlexSample') }}"
default_path_integration_event_type: "{{ nria_default_path_integration_event_type | default('defaultPathFlexSample') }}"

...
